<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN</title>
<script src="inc/common.js"></script>
<script src="guestbook.js"></script>
<style>
.no-msg {
    display: inline-block;
    padding: 7px 5px;
}

.has-msg {
    width: 500px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 20px;
    word-break: break-all;
    overflow-wrap: break-word;
    white-space: normal;
    border-radius: 10px;
    margin: 7px 0px 7px 0px;
    background: rgba(255, 255, 255, 0.1) !important;
    position: relative;
}

.has-msg img { width: 100%; }

.btn-row-delete {
    position: absolute;
    right: 15px;
    top: 15px;
}

#admin-table {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
}
</style>
</head>

<body style="opacity:0;">

    <div class="container" id="container">
        <div class="d-flex justify-content-between align-items-center mb-5 px-3">
            <div id="navigator"></div>
            <button class="btn btn-logout px-4" id="logoutBtn">Logout</button>
        </div>

        <div class="row g-4">
            <div class="col-12 mt-4">
                <div class="glass-panel text-center">
                    <p class="text-uppercase small opacity-75">Total Visitors</p>
                    <h3 class="display-6 fw-bold" id="totalVisitors">1,240</h3>
                </div>
            </div>

            <div class="col-12 mt-4">
                <div class="glass-panel">
                    <div id="admin-table"></div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
